name: Curriculum

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    name: Audit & catalog (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: No embedded answers in server-persisted pools (hard fail)
        run: |
          # Security invariant (task 5b): readiness/wrap-up/knowledge-check pools
          # must NOT embed answer/explain in this public repo. NOT warn-only.
          python3 scripts/check_no_embedded_answers.py

      - name: Run audit_lessons.py
        run: |
          # Warn-only — do not fail the build yet.
          python3 scripts/audit_lessons.py || true

      - name: Verify catalog.json is current
        run: |
          # Warn-only — do not fail the build yet.
          python3 scripts/build_catalog.py --check || true

      - name: Verify roadmap.md is current
        run: |
          # Warn-only — do not fail the build yet.
          python3 scripts/generate_roadmap.py --check || true

      - name: Verify flashcards.json is current
        run: |
          # Warn-only — do not fail the build yet.
          python3 scripts/build_flashcards.py --check || true

  mkdocs:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install site tooling
        # Install from requirements.txt so CI exercises the same dependency set
        # the setup docs tell contributors and students to install.
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

  deploy:
    name: Deploy to GitHub Pages
    # Publish from main only — PR runs stop at the mkdocs build above.
    if: github.event_name == 'push'
    # Gate on the audit job too: it hard-fails when a server-persisted pool
    # embeds answers, and that must never reach the public site.
    needs: [audit, mkdocs]
    runs-on: ubuntu-latest

    permissions:
      pages: write      # publish to Pages
      id-token: write   # OIDC token that deploy-pages verifies

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # One Pages deploy at a time; queue rather than cancel so a push to main
    # is never silently dropped.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install site tooling
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
