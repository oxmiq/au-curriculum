<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inference Engineering — Visual Flashcards</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --ink: #f1f5f9;
    --ink-dim: #94a3b8;
    --rule: #334155;
    --cat-fund: #2563eb;
    --cat-models: #7c3aed;
    --cat-hw: #64748b;
    --cat-sw: #ea580c;
    --cat-tech: #dc2626;
    --cat-modal: #16a34a;
    --cat-prod: #0d9488;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 28px 32px 12px; max-width: 1320px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; font-weight: 800; }
  header h1 span { color: #f97316; }
  header .sub { color: var(--ink-dim); margin-top: 6px; font-size: 15px; }
  .controls { padding: 16px 32px; max-width: 1320px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls .label { color: var(--ink-dim); font-size: 13px; margin-right: 4px; }
  .filter-btn { background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    font-weight: 600; letter-spacing: 0.02em; transition: all 0.15s ease; }
  .filter-btn:hover { border-color: #f97316; }
  .filter-btn.active { background: #f97316; color: #0f172a; border-color: #f97316; }
  .filter-btn[data-cat="fund"].active { background: var(--cat-fund); border-color: var(--cat-fund); color: white; }
  .filter-btn[data-cat="models"].active { background: var(--cat-models); border-color: var(--cat-models); color: white; }
  .filter-btn[data-cat="hw"].active { background: var(--cat-hw); border-color: var(--cat-hw); color: white; }
  .filter-btn[data-cat="sw"].active { background: var(--cat-sw); border-color: var(--cat-sw); color: white; }
  .filter-btn[data-cat="tech"].active { background: var(--cat-tech); border-color: var(--cat-tech); color: white; }
  .filter-btn[data-cat="modal"].active { background: var(--cat-modal); border-color: var(--cat-modal); color: white; }
  .filter-btn[data-cat="prod"].active { background: var(--cat-prod); border-color: var(--cat-prod); color: white; }

  .hint { padding: 0 32px; max-width: 1320px; margin: 0 auto 12px;
    color: var(--ink-dim); font-size: 13px; }

  .grid {
    padding: 16px 32px 80px; max-width: 1320px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card { perspective: 1200px; height: 320px; cursor: pointer; }
  .card.hidden { display: none; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--surface);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .face.back { transform: rotateY(180deg); }

  .badge {
    display: inline-block;
    padding: 4px 10px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: white; align-self: flex-start;
  }
  .card[data-cat="fund"] .badge { background: var(--cat-fund); }
  .card[data-cat="models"] .badge { background: var(--cat-models); }
  .card[data-cat="hw"] .badge { background: var(--cat-hw); }
  .card[data-cat="sw"] .badge { background: var(--cat-sw); }
  .card[data-cat="tech"] .badge { background: var(--cat-tech); }
  .card[data-cat="modal"] .badge { background: var(--cat-modal); }
  .card[data-cat="prod"] .badge { background: var(--cat-prod); }

  .card[data-cat="fund"] .face { border-top: 3px solid var(--cat-fund); }
  .card[data-cat="models"] .face { border-top: 3px solid var(--cat-models); }
  .card[data-cat="hw"] .face { border-top: 3px solid var(--cat-hw); }
  .card[data-cat="sw"] .face { border-top: 3px solid var(--cat-sw); }
  .card[data-cat="tech"] .face { border-top: 3px solid var(--cat-tech); }
  .card[data-cat="modal"] .face { border-top: 3px solid var(--cat-modal); }
  .card[data-cat="prod"] .face { border-top: 3px solid var(--cat-prod); }

  .front { padding: 16px 16px 14px; }
  .front .icon {
    flex: 1; display: flex; align-items: center; justify-content: center;
    margin: 6px 0;
  }
  .front .icon svg { width: 100px; height: 100px; }
  .front .term {
    font-size: 19px; font-weight: 700; line-height: 1.2;
    text-align: center; color: var(--ink);
    padding: 0 6px;
  }
  .front .flip-hint {
    font-size: 10px; color: var(--ink-dim); text-align: center; margin-top: 8px;
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  .back { padding: 18px 18px 16px; }
  .back .def {
    flex: 1; display: flex; align-items: center;
    font-size: 14px; line-height: 1.5; color: var(--ink);
    margin-top: 10px;
  }
  .back .def strong { color: #f97316; }

  @media print {
    body { background: white; color: black; }
    header, .controls, .hint { display: none; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      padding: 12px; page-break-inside: auto; }
    .card { height: 240px; perspective: none; cursor: default; page-break-inside: avoid; }
    .card-inner { transform: none !important; transform-style: flat; }
    .face { box-shadow: none; border: 1px solid #ccc; background: white !important;
      page-break-inside: avoid; }
    .face.back { display: none; }
    .badge { color: white !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Inference <span>Engineering</span> · Flashcards</h1>
  <div class="sub">100 high-yield study cards. Click any card to flip it. Use the filters to study by topic.</div>
</header>
<div class="controls">
  <span class="label">Filter:</span>
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="fund">Fundamentals</button>
  <button class="filter-btn" data-cat="models">Models</button>
  <button class="filter-btn" data-cat="hw">Hardware</button>
  <button class="filter-btn" data-cat="sw">Software</button>
  <button class="filter-btn" data-cat="tech">Techniques</button>
  <button class="filter-btn" data-cat="modal">Modalities</button>
  <button class="filter-btn" data-cat="prod">Production</button>
</div>
<div class="hint">Tip: press <strong>F</strong> to flip all visible cards, or <strong>R</strong> to reset.</div>
<div class="grid" id="grid"></div>

<!-- SVG library: each card references a symbol by id. Strokes use currentColor so the
     icon picks up the card's category color via CSS. -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>
    <!-- 1. ARROW FLOW (inference / pipeline) -->
    <symbol id="i-flow" viewBox="0 0 100 100">
      <rect x="6" y="36" width="22" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="40" y="36" width="22" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="74" y="36" width="22" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M28 50 L40 50 M62 50 L74 50" stroke="currentColor" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0 0 L6 3 L0 6 Z" fill="currentColor"/></marker></defs>
    </symbol>

    <!-- 2. TRAINING vs INFERENCE — gears/factory + chat -->
    <symbol id="i-train-infer" viewBox="0 0 100 100">
      <circle cx="28" cy="50" r="16" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M28 30 L28 26 M28 70 L28 74 M48 50 L52 50 M8 50 L4 50
               M14 36 L11 33 M42 36 L45 33 M14 64 L11 67 M42 64 L45 67"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M58 36 L92 36 L92 60 L82 60 L78 70 L74 60 L58 60 Z"
            fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    </symbol>

    <!-- 3. THREE LAYERS / stack -->
    <symbol id="i-stack" viewBox="0 0 100 100">
      <rect x="14" y="26" width="72" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="14" y="44" width="72" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="14" y="62" width="72" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>
      <text x="50" y="36" text-anchor="middle" font-size="9" fill="currentColor">runtime</text>
      <text x="50" y="54" text-anchor="middle" font-size="9" fill="currentColor">infra</text>
      <text x="50" y="72" text-anchor="middle" font-size="9" fill="currentColor">tooling</text>
    </symbol>

    <!-- 4. SIX TECHNIQUES / hexagon grid -->
    <symbol id="i-six" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="30" cy="30" r="10"/>
        <circle cx="50" cy="30" r="10"/>
        <circle cx="70" cy="30" r="10"/>
        <circle cx="30" cy="70" r="10"/>
        <circle cx="50" cy="70" r="10"/>
        <circle cx="70" cy="70" r="10"/>
      </g>
      <g fill="currentColor">
        <circle cx="30" cy="30" r="2"/><circle cx="50" cy="30" r="2"/><circle cx="70" cy="30" r="2"/>
        <circle cx="30" cy="70" r="2"/><circle cx="50" cy="70" r="2"/><circle cx="70" cy="70" r="2"/>
      </g>
    </symbol>

    <!-- 5. CLOCK / latency -->
    <symbol id="i-clock" viewBox="0 0 100 100">
      <circle cx="50" cy="52" r="30" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M50 32 L50 52 L66 60" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="50" cy="52" r="3" fill="currentColor"/>
      <path d="M50 16 L50 22 M86 52 L80 52 M50 88 L50 82 M14 52 L20 52"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <!-- 6. STREAMING TOKENS / flowing dots -->
    <symbol id="i-stream" viewBox="0 0 100 100">
      <path d="M8 50 Q26 30 50 50 T92 50" stroke="currentColor" stroke-width="2.5" fill="none"/>
      <circle cx="18" cy="44" r="3" fill="currentColor"/>
      <circle cx="36" cy="36" r="3" fill="currentColor"/>
      <circle cx="54" cy="50" r="3" fill="currentColor"/>
      <circle cx="72" cy="48" r="3" fill="currentColor"/>
      <circle cx="86" cy="50" r="3" fill="currentColor"/>
    </symbol>

    <!-- 7. BELL CURVE -->
    <symbol id="i-bell" viewBox="0 0 100 100">
      <path d="M10 80 Q30 80 38 60 Q44 30 50 30 Q56 30 62 60 Q70 80 90 80"
            fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M10 80 L90 80" stroke="currentColor" stroke-width="2"/>
      <path d="M50 80 L50 30" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
      <path d="M66 80 L66 60" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="50" y="92" text-anchor="middle" font-size="7" fill="currentColor">P50</text>
      <text x="66" y="92" text-anchor="middle" font-size="7" fill="currentColor">P95</text>
    </symbol>

    <!-- 8. SCALES / latency vs throughput -->
    <symbol id="i-scales" viewBox="0 0 100 100">
      <path d="M50 20 L50 76 M30 76 L70 76" stroke="currentColor" stroke-width="3"/>
      <path d="M50 30 L20 50 M50 30 L80 50" stroke="currentColor" stroke-width="2.5"/>
      <rect x="8" y="50" width="24" height="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <rect x="68" y="50" width="24" height="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <text x="20" y="61" text-anchor="middle" font-size="7" fill="currentColor">lat</text>
      <text x="80" y="61" text-anchor="middle" font-size="7" fill="currentColor">tps</text>
    </symbol>

    <!-- 9. MATRIX MULTIPLY -->
    <symbol id="i-matmul" viewBox="0 0 100 100">
      <g stroke="currentColor" stroke-width="2" fill="none">
        <rect x="6" y="32" width="22" height="36"/>
        <line x1="6" y1="44" x2="28" y2="44"/>
        <line x1="6" y1="56" x2="28" y2="56"/>
        <line x1="14" y1="32" x2="14" y2="68"/>
        <line x1="22" y1="32" x2="22" y2="68"/>
      </g>
      <text x="38" y="55" font-size="14" fill="currentColor" font-weight="700">×</text>
      <g stroke="currentColor" stroke-width="2" fill="none">
        <rect x="48" y="32" width="22" height="36"/>
        <line x1="48" y1="44" x2="70" y2="44"/>
        <line x1="48" y1="56" x2="70" y2="56"/>
        <line x1="56" y1="32" x2="56" y2="68"/>
        <line x1="64" y1="32" x2="64" y2="68"/>
      </g>
      <text x="80" y="55" font-size="14" fill="currentColor" font-weight="700">=</text>
      <rect x="88" y="46" width="8" height="8" fill="currentColor"/>
    </symbol>

    <!-- 10. ATTENTION / web of connections -->
    <symbol id="i-attention" viewBox="0 0 100 100">
      <g fill="currentColor">
        <circle cx="20" cy="50" r="4"/><circle cx="40" cy="30" r="4"/>
        <circle cx="60" cy="30" r="4"/><circle cx="80" cy="50" r="4"/>
        <circle cx="40" cy="70" r="4"/><circle cx="60" cy="70" r="4"/>
      </g>
      <g stroke="currentColor" stroke-width="1.5" opacity="0.6">
        <line x1="20" y1="50" x2="40" y2="30"/>
        <line x1="20" y1="50" x2="60" y2="30"/>
        <line x1="20" y1="50" x2="80" y2="50"/>
        <line x1="20" y1="50" x2="40" y2="70"/>
        <line x1="20" y1="50" x2="60" y2="70"/>
        <line x1="40" y1="30" x2="60" y2="30"/>
        <line x1="40" y1="30" x2="80" y2="50"/>
        <line x1="60" y1="30" x2="80" y2="50"/>
        <line x1="80" y1="50" x2="40" y2="70"/>
        <line x1="80" y1="50" x2="60" y2="70"/>
      </g>
    </symbol>

    <!-- 11. KV CACHE / stacked memory -->
    <symbol id="i-kv" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="20" y="22" width="60" height="10" rx="1"/>
        <rect x="20" y="34" width="60" height="10" rx="1"/>
        <rect x="20" y="46" width="60" height="10" rx="1"/>
        <rect x="20" y="58" width="60" height="10" rx="1"/>
        <rect x="20" y="70" width="60" height="10" rx="1"/>
      </g>
      <text x="50" y="29" text-anchor="middle" font-size="6" fill="currentColor" font-family="monospace">K0 V0</text>
      <text x="50" y="41" text-anchor="middle" font-size="6" fill="currentColor" font-family="monospace">K1 V1</text>
      <text x="50" y="53" text-anchor="middle" font-size="6" fill="currentColor" font-family="monospace">K2 V2</text>
      <text x="50" y="65" text-anchor="middle" font-size="6" fill="currentColor" font-family="monospace">K3 V3</text>
      <text x="50" y="77" text-anchor="middle" font-size="6" fill="currentColor" font-family="monospace">K4 V4</text>
    </symbol>

    <!-- 12. MOE / branching to experts -->
    <symbol id="i-moe" viewBox="0 0 100 100">
      <circle cx="20" cy="50" r="6" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="2">
        <path d="M26 50 L60 22"/>
        <path d="M26 50 L60 38"/>
        <path d="M26 50 L60 54"/>
        <path d="M26 50 L60 70"/>
        <path d="M26 50 L60 86"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-width="2">
        <rect x="60" y="16" width="28" height="12" rx="2"/>
        <rect x="60" y="32" width="28" height="12" rx="2"/>
        <rect x="60" y="48" width="28" height="12" rx="2"/>
        <rect x="60" y="64" width="28" height="12" rx="2"/>
        <rect x="60" y="80" width="28" height="12" rx="2"/>
      </g>
      <g fill="currentColor">
        <rect x="60" y="32" width="28" height="12" rx="2" opacity="0.3"/>
        <rect x="60" y="64" width="28" height="12" rx="2" opacity="0.3"/>
      </g>
    </symbol>

    <!-- 13. DENOISING / noise to image -->
    <symbol id="i-denoise" viewBox="0 0 100 100">
      <rect x="8" y="28" width="22" height="44" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <g fill="currentColor" opacity="0.7">
        <circle cx="14" cy="36" r="1"/><circle cx="20" cy="40" r="1"/><circle cx="26" cy="34" r="1"/>
        <circle cx="14" cy="50" r="1"/><circle cx="22" cy="54" r="1"/><circle cx="18" cy="62" r="1"/>
        <circle cx="26" cy="46" r="1"/><circle cx="14" cy="62" r="1"/><circle cx="26" cy="64" r="1"/>
      </g>
      <path d="M34 50 L42 50" stroke="currentColor" stroke-width="2" marker-end="url(#arrow2)"/>
      <defs><marker id="arrow2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0 0 L6 3 L0 6 Z" fill="currentColor"/></marker></defs>
      <rect x="44" y="28" width="22" height="44" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M48 60 Q55 30 62 60" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M68 50 L76 50" stroke="currentColor" stroke-width="2" marker-end="url(#arrow2)"/>
      <rect x="78" y="28" width="14" height="44" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="85" cy="50" r="6" fill="currentColor"/>
    </symbol>

    <!-- 14. ROOFLINE / arithmetic intensity -->
    <symbol id="i-roofline" viewBox="0 0 100 100">
      <path d="M14 80 L86 80 M14 80 L14 18" stroke="currentColor" stroke-width="2"/>
      <path d="M14 80 L40 30 L86 30" stroke="currentColor" stroke-width="3" fill="none"/>
      <line x1="40" y1="30" x2="40" y2="80" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="40" y="92" text-anchor="middle" font-size="7" fill="currentColor">ops:byte</text>
      <text x="22" y="60" font-size="7" fill="currentColor">mem</text>
      <text x="60" y="24" text-anchor="middle" font-size="7" fill="currentColor">compute</text>
    </symbol>

    <!-- 15. FLASH / FlashAttention -->
    <symbol id="i-flash" viewBox="0 0 100 100">
      <path d="M58 14 L34 50 L48 50 L42 86 L66 50 L52 50 Z"
            fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>

    <!-- 16. PAGE / PagedAttention -->
    <symbol id="i-pages" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="2">
        <rect x="14" y="22" width="22" height="22" rx="2"/>
        <rect x="40" y="22" width="22" height="22" rx="2"/>
        <rect x="66" y="22" width="22" height="22" rx="2"/>
        <rect x="14" y="56" width="22" height="22" rx="2"/>
        <rect x="40" y="56" width="22" height="22" rx="2"/>
        <rect x="66" y="56" width="22" height="22" rx="2"/>
      </g>
      <g fill="currentColor" opacity="0.4">
        <rect x="14" y="22" width="22" height="22" rx="2"/>
        <rect x="66" y="22" width="22" height="22" rx="2"/>
        <rect x="40" y="56" width="22" height="22" rx="2"/>
      </g>
    </symbol>

    <!-- 17. CHIP / GPU -->
    <symbol id="i-chip" viewBox="0 0 100 100">
      <rect x="22" y="22" width="56" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="32" y="32" width="36" height="36" rx="2" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
      <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M30 14 L30 22 M42 14 L42 22 M54 14 L54 22 M66 14 L66 22"/>
        <path d="M30 78 L30 86 M42 78 L42 86 M54 78 L54 86 M66 78 L66 86"/>
        <path d="M14 30 L22 30 M14 42 L22 42 M14 54 L22 54 M14 66 L22 66"/>
        <path d="M78 30 L86 30 M78 42 L86 42 M78 54 L86 54 M78 66 L86 66"/>
      </g>
    </symbol>

    <!-- 18. TENSOR CORE / matrix highlighted -->
    <symbol id="i-tensor-core" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="2">
        <rect x="24" y="24" width="52" height="52"/>
        <line x1="24" y1="37" x2="76" y2="37"/>
        <line x1="24" y1="50" x2="76" y2="50"/>
        <line x1="24" y1="63" x2="76" y2="63"/>
        <line x1="37" y1="24" x2="37" y2="76"/>
        <line x1="50" y1="24" x2="50" y2="76"/>
        <line x1="63" y1="24" x2="63" y2="76"/>
      </g>
      <g fill="currentColor" opacity="0.7">
        <rect x="37" y="37" width="13" height="13"/>
        <rect x="50" y="50" width="13" height="13"/>
        <rect x="63" y="63" width="13" height="13"/>
      </g>
    </symbol>

    <!-- 19. HBM / stacked memory layers -->
    <symbol id="i-hbm" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="20" y="20" width="60" height="10" rx="1"/>
        <rect x="20" y="32" width="60" height="10" rx="1"/>

const grid = document.getElementById("grid");
const catNames = {
  fund: "Fundamentals", models: "Models", hw: "Hardware",
  sw: "Software", tech: "Techniques", modal: "Modalities", prod: "Production"
};

CARDS.forEach((c, idx) => {
  const [cat, term, def, icon] = c;
  const div = document.createElement("div");
  div.className = "card";
  div.dataset.cat = cat;
  div.innerHTML = `
    <div class="card-inner">
      <div class="face front">
        <span class="badge">${catNames[cat]}</span>
        <div class="icon" style="color: var(--cat-${cat})">
          <svg><use href="#${icon}"></use></svg>
        </div>
        <div class="term">${term}</div>
        <div class="flip-hint">click to flip</div>
      </div>
      <div class="face back">
        <span class="badge">${catNames[cat]}</span>
        <div class="def">${def}</div>
      </div>
    </div>
  `;
  div.addEventListener("click", () => div.classList.toggle("flipped"));
  grid.appendChild(div);
});

// Filter buttons
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const cat = btn.dataset.cat;
    document.querySelectorAll(".card").forEach(card => {
      card.classList.remove("flipped");
      if (cat === "all" || card.dataset.cat === cat) {
        card.classList.remove("hidden");
      } else {
        card.classList.add("hidden");
      }
    });
  });
});

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "f") {
    document.querySelectorAll(".card:not(.hidden)").forEach(c => c.classList.toggle("flipped"));
  } else if (e.key.toLowerCase() === "r") {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("flipped"));
  }
});

console.log(`${CARDS.length} flashcards loaded.`);
</script>
